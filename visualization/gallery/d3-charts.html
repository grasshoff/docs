<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ObjID18 Measurement Charts</title>
<link rel="stylesheet" href="../viz-runtime/famulus-tokens.css">
<link rel="stylesheet" href="../viz-runtime/viz.css">
<style>
  main { max-width: 760px; margin: 0 auto; padding: 1.5rem 16px 3rem; }
  h1 { font-size: 1.35rem; color: var(--fv-oxford); margin: 0 0 0.3rem; }
  p.lead { color: var(--fv-muted); margin: 0 0 1.5rem; }
</style>
<script>
  window.addEventListener('error', e => { document.documentElement.dataset.renderError = String(e.message || e); });
  window.addEventListener('unhandledrejection', e => { document.documentElement.dataset.renderError = String(e.reason); });
</script>
<script src="../vendor/d3.v7.min.js"></script>
</head>
<body class="fv-page">
<main>
  <h1>ObjID18 — hour steps and day-circles</h1>
  <p class="lead" id="lead"></p>
  <figure class="fv-figure"><div id="steps"></div>
    <figcaption id="cap-steps"></figcaption></figure>
  <figure class="fv-figure"><div id="residuals"></div>
    <figcaption>Deviation of each hour step from 15°. The dashed lines at ±1° are a reading aid; the steps beyond them are drawn in gold. The parameter file gives no per-step uncertainty, so none is drawn.</figcaption></figure>
  <figure class="fv-figure"><div id="radii"></div>
    <figcaption>Radii of the three day-circles; the equinoctial circle is marked.</figcaption></figure>
</main>
<script type="module">
import { barChart, residualChart } from '../viz-runtime/d3/charts.js';

const d = await (await fetch('data/objid18-parameters.json')).json();
const p = d.parameters;
const steps = p.equi_hour_steps_deg;
const mean = steps.reduce((a, b) => a + b, 0) / steps.length;
document.getElementById('lead').textContent =
  `From the parameter file of the ObjID18 paper (extracted ${d.extracted}): ${steps.length} hour steps on the equinoctial day-line, mean ${mean.toFixed(2)}°.`;
const short = steps.map((s, i) => (s < 14 ? i : -1)).filter(i => i >= 0);
document.getElementById('cap-steps').textContent =
  `Angular steps between adjacent hour marks; the ${short.length} steps below 14° (intervals ${short.map(i => i + 1).join(', ')}) are drawn in gold.`;

barChart(document.getElementById('steps'), {
  labels: steps.map((_, i) => String(i + 1)), values: steps, highlight: short, animate: true,
  xlabel: 'hour interval', ylabel: 'angular step (°)', width: 700, height: 340,
});
residualChart(document.getElementById('residuals'), {
  ids: steps.map((_, i) => i + 1), residuals: steps.map(s => s - 15),
  threshold: 1, animate: true, xlabel: 'hour interval', ylabel: 'step − 15° (°)', width: 700, height: 320,
});
const names = ['DayCurveSuSo', 'DayCurveEqui', 'DayCurveWiSo'];
barChart(document.getElementById('radii'), {
  labels: ['SuSo', 'Equi', 'WiSo'], values: names.map(n => p.day_circles[n].radius_mm), highlight: 1,
  ylabel: 'radius (mm)', width: 700, height: 320,
});
</script>
</body>
</html>
