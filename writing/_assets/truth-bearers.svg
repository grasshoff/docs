<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 288" width="624" height="288" role="img" aria-label="Only the proposition is true or false" style="font-family: &quot;Source Sans 3&quot;, Inter, &quot;Helvetica Neue&quot;, Arial, sans-serif; background: rgb(250, 250, 245);"><rect x="0" y="0" width="624" height="288" fill="#fafaf5"></rect><defs><marker id="bh-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#002147"></path></marker></defs><g class="bh-node"><rect x="24" y="48" width="144" height="48" rx="0" fill="#ffffff" stroke="#002147" stroke-width="2"></rect><text x="96" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Sentence</text><text x="96" y="85" text-anchor="middle" font-size="11" fill="#5c5348">Satz</text></g><g class="bh-node"><rect x="240" y="48" width="144" height="48" rx="0" fill="#ffffff" stroke="#002147" stroke-width="3"></rect><text x="312" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Proposition</text><text x="312" y="85" text-anchor="middle" font-size="11" fill="#5c5348">Aussage</text></g><g class="bh-node"><rect x="456" y="48" width="144" height="48" rx="0" fill="#ffffff" stroke="#002147" stroke-width="2"></rect><text x="528" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">State of affairs</text><text x="528" y="85" text-anchor="middle" font-size="11" fill="#5c5348">Sachverhalt</text></g><g class="bh-node"><rect x="456" y="192" width="144" height="48" rx="0" fill="#002147" stroke="#002147" stroke-width="2"></rect><text x="528" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Fact</text><text x="528" y="229" text-anchor="middle" font-size="11" fill="#dbe3ee">Tatsache</text></g><rect x="240" y="40" width="144" height="4" fill="#cfb53b"></rect><text x="312" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#8c6d2a">true